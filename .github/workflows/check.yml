name: check

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf pkg-config
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Rust tests
        run: cargo test -p codex-notify-core -p codex-notify-hook
      - name: Stage Hook sidecar
        working-directory: apps/desktop
        run: npm run stage:hook
      - name: Check Tauri backend
        run: cargo check -p codex-notify-desktop
      - name: Frontend tests
        working-directory: apps/desktop
        run: npm test
      - name: Frontend build
        working-directory: apps/desktop
        run: npm run build
