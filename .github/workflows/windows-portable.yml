name: Windows portable

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build release Hook and stage sidecar
        shell: pwsh
        run: |
          cargo build --release -p codex-notify-hook
          $triple = rustc --print host-tuple
          New-Item -ItemType Directory -Force apps/desktop/src-tauri/binaries | Out-Null
          Copy-Item target/release/codex-notify-hook.exe "apps/desktop/src-tauri/binaries/codex-notify-hook-$triple.exe"

      - name: Build portable desktop executable
        working-directory: apps/desktop
        run: npx tauri build --no-bundle

      - name: Assemble single-file portable executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item target/release/codex-notify-desktop.exe artifacts/CodexNotify-Windows-x64.exe
          (Get-FileHash artifacts/CodexNotify-Windows-x64.exe -Algorithm SHA256).Hash.ToLower() | Set-Content artifacts/CodexNotify-Windows-x64.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: CodexNotify-Windows-x64
          path: |
            artifacts/CodexNotify-Windows-x64.exe
            artifacts/CodexNotify-Windows-x64.exe.sha256
          if-no-files-found: error
          retention-days: 30
